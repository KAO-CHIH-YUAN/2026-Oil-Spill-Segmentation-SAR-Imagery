# =====================================================================
# M4D 5-class — 原生解析度 512 patch 版 (不變形、不降採樣)
#   VV→RGB transform → 原尺寸1250×650 → 切 512 patch (oil overlap256)。邊緣 pad label=255(ignore)。
#   對照 direct-resize(變形) 與 pad-ignore(不變形但內容半解析度)。
#   ★ 患: patch 數多(train 9189) → 每 fold ~4-5h。先 single_fold 拿代表數字。
#   ★ 注意: 此為 patch-level per-class IoU，與 whole-image(resize/pad版) 評估基準不同，
#           不可 1:1 直接比 (patch-level 通常偏高)；要 whole-image 需開 reconstruction。
# =====================================================================
results_base_dir: '/home/yuan/Yuan/OIL_Project_12_7/result/model/M4D_Padded_Multiclass'
excel_log_path: '/home/yuan/Yuan/OIL_Project_12_7/result/excel_log/M4D_Multiclass_log.xlsx'

experiments:
  - experiment_name: 'M4D_deepsup_5class_RGBours_patch512'
    mode: 'train'
    run: true
    architecture: 'segformer_deepsup'
    architecture_cfg:
      aux_loss_weight: 0.3
      aux_delay_epochs: 10
      aux_warmup_epochs: 30
      in_channels: 3
      hf_model_name: '/home/yuan/Yuan/OIL_Project_12_7/pretrain/local_model/segformer-b5'
      aux_in_channels: 320
      drop_path_rate: 0.3
      classifier_dropout_prob: 0
      ignore_index: 255          # 邊緣 pad 區 label=255 忽略
    cross_validation:
      enabled: True
      k_folds: 5
      random_state: 42
      val_ratio: 0.05
      single_fold_only: True     # 先跑 fold_1 拿代表數字 (patch 多, 5-fold 太久)
    base_model: ''
    dataset:
      path: '/home/yuan/Yuan/OIL_Project_12_7/dataset/M4Ds/M4D-ourMethod/M4D_P512_TrainOilOv256_TestOv256'
      nc: 5
      names: ['Sea Surface', 'Oil Spill', 'Look-alike', 'Ship', 'Land']
    imgsz: 512
    train:
      epochs: 70
      loss_function: 'focal_iou_ls'
      imgsz: 512
      batch_size: 12
      workers: 4
      patience: 20
      lr0: 0.0001
      weight_decay: 0.02
      amp: true
      use_weighted_sampler: false
      freeze_epochs: 10
      degrees: 45
      translate: 0.3
      fliplr: 0.5
      flipud: 0.5
      coarse_dropout: 0.1
      cutmix: 0.1
      cutmix_alpha: 1.0
      copy_paste: 0.1
      gradient_accumulation_steps: 4
      random_brightness: 0.2
      random_contrast: 0.2
    post_tests:
      - test_name: 'M4D_5class_patch_test'
        dataset:
          path: '/home/yuan/Yuan/OIL_Project_12_7/dataset/M4Ds/M4D-ourMethod/M4D_P512_TrainOilOv256_TestOv256'
          nc: 5
          names: ['Sea Surface', 'Oil Spill', 'Look-alike', 'Ship', 'Land']
        reconstruction:
          enabled: false
        evaluation_on_original:
          enabled: false
        draw_bounding_boxes: false
        grad_cam:
          enabled: false
